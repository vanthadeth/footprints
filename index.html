<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Fixed dark-gray status bar/browser chrome with white content, always
         -- deliberately NOT theme-dependent (see src/lib/theme.ts). -->
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="Footprints, by HIG — journal your sales journey." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (not "default"/"black-translucent") is the one that reads
         as a solid dark-gray bar with white status text on iOS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Footprints" />
    <title>Footprints, by HIG</title>
    <script>
      // Runs before first paint so a dark-preferring/previously-toggled
      // visitor never sees a flash of the light theme. Keep in sync with
      // src/lib/theme.ts (same storage key + fallback logic). Status bar
      // colors are static above, not touched here -- they don't change
      // with theme.
      try {
        var t = localStorage.getItem('footprints-theme')
        if (t !== 'light' && (t === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
